<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global B2B AI Voice Agency Directory | Top Conversational Partners</title>
    <meta name="description" content="Discover and hire top-rated global AI voice agencies, Vapi developers, and conversational automation partners for B2B scale.">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); line-height: 1.5; }
        .top-bar { display: flex; justify-content: flex-end; padding: 1rem 2rem; max-width: 1200px; margin: 0 auto; }
        .lang-selector { background-color: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.9rem; outline: none; }
        header { text-align: center; padding: 2rem 1rem; max-width: 800px; margin: 0 auto; }
        header h1 { font-size: 2.25rem; margin-bottom: 0.75rem; }
        header p { color: var(--text-secondary); font-size: 1.1rem; }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .category-container { margin-bottom: 3rem; }
        .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .card-title { font-size: 1.25rem; font-weight: 600; }
        .region-tag { font-size: 0.75rem; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 0.25rem 0.6rem; border-radius: 20px; }
        .card-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .btn-card { display: inline-block; text-align: center; color: var(--accent); border: 1px solid var(--accent); padding: 0.6rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; }
        footer { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 4rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <select id="languageSelect" class="lang-selector" onchange="changeLanguage(this.value)">
            <option value="en">English 🇬🇧</option>
            <option value="es">Español 🇪🇸</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="de">Deutsch 🇩🇪</option>
        </select>
    </div>
    <header>
        <h1 data-i18n="title">Global B2B AI Voice Agency Directory</h1>
        <p data-i18n="subtitle">The definitive global index connecting enterprises with elite conversational AI partners, Vapi developers, and voice automation experts.</p>
    </header>
